<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلفية اللوحة — شرطة دبي</title>
<style>
  /* ════════════════════════════════════════════════════════════════════
   *  ✦  شرطة دبي · خلفية اللوحة الرئيسية  ✦
   *  Sleek static backdrop for SAS VA overlay — dark emerald tech.
   *  Near-black stage · soft green light · thin HUD rings behind centre
   *  · fine contour lines. No animation, no JS, no external assets.
   * ════════════════════════════════════════════════════════════════════ */
  :root {
    --mint:      #2ee6a8;
    --mint-soft: rgba(46, 230, 168, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    /* base: near-black with deep emerald pooling, like the reference heroes */
    background:
      /* main light — soft emerald bloom upper centre-right */
      radial-gradient(ellipse 52% 44% at 68% 22%, rgba(38, 190, 138, 0.16) 0%, transparent 65%),
      /* counter light — lower left, dimmer, cooler */
      radial-gradient(ellipse 46% 40% at 12% 88%, rgba(30, 150, 110, 0.12) 0%, transparent 62%),
      /* centre stage glow — barely there, keeps overlaid objects lifted */
      radial-gradient(ellipse 36% 32% at 50% 52%, rgba(40, 200, 145, 0.07) 0%, transparent 70%),
      /* deep vertical grade */
      linear-gradient(178deg, #071510 0%, #04100b 38%, #020a07 74%, #020805 100%);
  }

  .layer { position: fixed; inset: 0; }

  /* diagonal light shaft from the top-right corner — the "hero" light */
  .shaft {
    background: linear-gradient(215deg,
      rgba(46, 230, 168, 0.10) 0%,
      rgba(46, 230, 168, 0.035) 22%,
      transparent 48%);
  }

  /* svg artwork: rings, ticks, contour lines, dot fields */
  svg.art { width: 100%; height: 100%; display: block; }

  /* vignette + hairline top highlight — the cinematic frame */
  .grade::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(210, 255, 236, 0.05) 0%, transparent 1.5px),
      radial-gradient(ellipse 92% 84% at 50% 46%, transparent 58%, rgba(1, 5, 3, 0.62) 100%);
  }
  /* film grain — static, whisper-quiet */
  .grade::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(210, 255, 236, 0.030) 1px, transparent 1px),
      radial-gradient(circle at 19px 13px, rgba(210, 255, 236, 0.016) 1px, transparent 1px);
    background-size: 30px 30px, 47px 47px;
  }
</style>
</head>
<body>

  <div class="layer shaft"></div>

  <svg class="art layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <!-- glow for the bright arc -->
      <filter id="arcGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"   stop-color="rgba(46, 230, 168, 0)"/>
        <stop offset="0.5" stop-color="rgba(46, 230, 168, 0.85)"/>
        <stop offset="1"   stop-color="rgba(46, 230, 168, 0)"/>
      </linearGradient>
      <linearGradient id="arcGrad2" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0"   stop-color="rgba(46, 230, 168, 0)"/>
        <stop offset="0.5" stop-color="rgba(46, 230, 168, 0.35)"/>
        <stop offset="1"   stop-color="rgba(46, 230, 168, 0)"/>
      </linearGradient>
      <!-- dot field pattern -->
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="1.3" cy="1.3" r="1.3" fill="rgba(146, 255, 205, 0.09)"/>
      </pattern>
      <radialGradient id="dotFadeTL" cx="0" cy="0" r="1">
        <stop offset="0"   stop-color="#fff"/>
        <stop offset="1"   stop-color="#000"/>
      </radialGradient>
      <radialGradient id="dotFadeBR" cx="1" cy="1" r="1">
        <stop offset="0"   stop-color="#fff"/>
        <stop offset="1"   stop-color="#000"/>
      </radialGradient>
      <mask id="dotMaskTL"><rect x="0" y="0" width="640" height="480" fill="url(#dotFadeTL)"/></mask>
      <mask id="dotMaskBR"><rect x="1280" y="620" width="640" height="460" fill="url(#dotFadeBR)"/></mask>
      <!-- fade for contour lines: strongest mid-right, gone at edges -->
      <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"    stop-color="rgba(46, 230, 168, 0)"/>
        <stop offset="0.35" stop-color="rgba(46, 230, 168, 0.10)"/>
        <stop offset="0.72" stop-color="rgba(46, 230, 168, 0.16)"/>
        <stop offset="1"    stop-color="rgba(46, 230, 168, 0)"/>
      </linearGradient>
      <!-- smooth centre halo — no hard edges -->
      <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="rgba(46, 230, 168, 0.070)"/>
        <stop offset="0.45" stop-color="rgba(46, 230, 168, 0.038)"/>
        <stop offset="0.75" stop-color="rgba(46, 230, 168, 0.012)"/>
        <stop offset="1"    stop-color="rgba(46, 230, 168, 0)"/>
      </radialGradient>
    </defs>

    <!-- ── corner dot fields ─────────────────────────────────────── -->
    <rect x="0" y="0" width="640" height="480" fill="url(#dots)" mask="url(#dotMaskTL)"/>
    <rect x="1280" y="620" width="640" height="460" fill="url(#dots)" mask="url(#dotMaskBR)"/>

    <!-- ── flowing contour lines, sweeping the lower stage ───────── -->
    <g fill="none" stroke="url(#lineFade)" stroke-width="1.1">
      <path d="M -40 852  C 420 800, 760 918, 1150 860  S 1720 792, 1960 838"/>
      <path d="M -40 886  C 430 836, 770 950, 1160 892  S 1730 826, 1960 872"/>
      <path d="M -40 921  C 440 873, 780 983, 1170 925  S 1740 861, 1960 907"/>
      <path d="M -40 957  C 450 911, 790 1017, 1180 959 S 1750 897, 1960 943"/>
      <path d="M -40 994  C 460 950, 800 1052, 1190 994 S 1760 934, 1960 980"/>
      <path d="M -40 1032 C 470 990, 810 1088, 1200 1030 S 1770 972, 1960 1018"/>
    </g>
    <!-- a mirrored, fainter set high in the frame -->
    <g fill="none" stroke="url(#lineFade)" stroke-width="1" opacity="0.45">
      <path d="M -40 118 C 480 168, 900 76, 1300 130 S 1800 186, 1960 152"/>
      <path d="M -40 84  C 490 132, 910 44,  1310 96  S 1810 150, 1960 118"/>
    </g>

    <!-- ── the centrepiece: thin HUD rings behind the main object ── -->
    <g>
      <!-- soft centre halo -->
      <circle cx="960" cy="540" r="430" fill="url(#haloGrad)"/>

      <!-- concentric hairlines -->
      <circle cx="960" cy="540" r="212" fill="none" stroke="rgba(146, 255, 205, 0.13)" stroke-width="1"/>
      <circle cx="960" cy="540" r="286" fill="none" stroke="rgba(146, 255, 205, 0.085)" stroke-width="1"/>
      <circle cx="960" cy="540" r="368" fill="none" stroke="rgba(146, 255, 205, 0.055)" stroke-width="1"/>
      <circle cx="960" cy="540" r="452" fill="none" stroke="rgba(146, 255, 205, 0.035)" stroke-width="1"/>
      <!-- dashed orbit -->
      <circle cx="960" cy="540" r="324" fill="none" stroke="rgba(146, 255, 205, 0.09)" stroke-width="1" stroke-dasharray="2 10"/>

      <!-- tick ring: 60 fine ticks on r=368 -->
      <g id="ticks" stroke="rgba(146, 255, 205, 0.10)" stroke-width="1"></g>

      <!-- the bright arc — top-right, like the reference lock badge -->
      <path d="M 960 328 A 212 212 0 0 1 1148 431"
            fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#arcGlow)"/>
      <!-- its counterweight — bottom-left, dimmer, wider ring -->
      <path d="M 772 649 A 286 286 0 0 1 700 466"
            fill="none" stroke="url(#arcGrad2)" stroke-width="2" stroke-linecap="round" filter="url(#arcGlow)"/>

      <!-- nodes where the arcs end -->
      <circle cx="1148" cy="431" r="4"   fill="#2ee6a8" filter="url(#arcGlow)"/>
      <circle cx="1148" cy="431" r="9"   fill="none" stroke="rgba(46, 230, 168, 0.35)" stroke-width="1"/>
      <circle cx="700"  cy="466" r="3"   fill="rgba(46, 230, 168, 0.75)"/>
      <circle cx="960"  cy="328" r="2.5" fill="rgba(146, 255, 205, 0.55)"/>

      <!-- four cardinal micro-marks on the outer ring -->
      <g stroke="rgba(146, 255, 205, 0.22)" stroke-width="1.5">
        <line x1="960" y1="82"  x2="960" y2="96"/>
        <line x1="960" y1="984" x2="960" y2="998"/>
        <line x1="502" y1="540" x2="516" y2="540"/>
        <line x1="1404" y1="540" x2="1418" y2="540"/>
      </g>
    </g>

    <!-- ── sparse "+" field marks — designed emptiness ───────────── -->
    <g stroke="rgba(146, 255, 205, 0.14)" stroke-width="1">
      <path d="M 250 260 h 12 M 256 254 v 12"/>
      <path d="M 1690 210 h 12 M 1696 204 v 12"/>
      <path d="M 1770 760 h 12 M 1776 754 v 12"/>
      <path d="M 165 700 h 12 M 171 694 v 12"/>
      <path d="M 1220 150 h 10 M 1225 145 v 10"/>
      <path d="M 640 940 h 10 M 645 935 v 10"/>
    </g>

    <script type="application/ecmascript"><![CDATA[
      /* 60 tick marks on r=368 — generated so the markup stays clean */
      (function () {
        var g = document.getElementById('ticks');
        var NS = 'http://www.w3.org/2000/svg';
        for (var i = 0; i < 60; i++) {
          var a = i * Math.PI * 2 / 60;
          var big = i % 5 === 0;
          var r0 = 368, r1 = big ? 378 : 374;
          var l = document.createElementNS(NS, 'line');
          l.setAttribute('x1', (960 + r0 * Math.cos(a)).toFixed(1));
          l.setAttribute('y1', (540 + r0 * Math.sin(a)).toFixed(1));
          l.setAttribute('x2', (960 + r1 * Math.cos(a)).toFixed(1));
          l.setAttribute('y2', (540 + r1 * Math.sin(a)).toFixed(1));
          if (big) l.setAttribute('stroke', 'rgba(146, 255, 205, 0.16)');
          g.appendChild(l);
        }
      })();
    ]]></script>
  </svg>

  <div class="layer grade"></div>

</body>
</html>

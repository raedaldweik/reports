<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخلفية السينمائية — شرطة دبي</title>
<style>
  /* ════════════════════════════════════════════════════════════════════
   *  ✦  شرطة دبي · الخلفية السينمائية  ✦
   *  Pure animated backdrop — no layout, no text. Everything else is
   *  overlaid in SAS VA. WebGL aurora (domain-warped fbm) + light dust
   *  + comets + ghost radar rings + cinematic grade (grain / vignette).
   * ════════════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030a06; }

  .layer { position: fixed; inset: 0; }

  /* 1 ── WebGL aurora (also the CSS fallback surface) */
  #gl {
    width: 100%; height: 100%;
    display: block;
    background:
      radial-gradient(ellipse 70% 55% at 50% 115%, rgba(31, 122, 75, 0.35) 0%, transparent 62%),
      radial-gradient(ellipse 60% 45% at 85% -8%,  rgba(24, 92, 60, 0.35)  0%, transparent 60%),
      linear-gradient(158deg, #081611 0%, #050f0a 45%, #030c07 100%);
  }

  /* 2 ── light dust */
  #dust { pointer-events: none; }

  /* 3 ── ghost radar ring system (identity, not content) */
  .rings { pointer-events: none; display: grid; place-items: center; }
  .rings > div { position: absolute; border-radius: 50%; }
  .ring-a { width: 62vmin; height: 62vmin; border: 1px solid rgba(147, 242, 189, 0.07); }
  .ring-b { width: 84vmin; height: 84vmin; border: 1px solid rgba(147, 242, 189, 0.05); }
  .ring-c {
    width: 73vmin; height: 73vmin;
    border: 1px dashed rgba(147, 242, 189, 0.09);
    animation: ring-spin 90s linear infinite;
  }
  .ring-d {
    width: 100vmin; height: 100vmin;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(63, 214, 133, 0.05) 18deg, transparent 46deg, transparent 360deg);
    -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%, #000 61%, transparent 62%);
            mask: radial-gradient(circle, transparent 55%, #000 56%, #000 61%, transparent 62%);
    animation: ring-spin 36s linear infinite;
  }
  @keyframes ring-spin { to { transform: rotate(360deg); } }
  .ring-c::before {
    content: '';
    position: absolute; top: -3px; left: 50%;
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(147, 242, 189, 0.75);
    box-shadow: 0 0 10px rgba(63, 214, 133, 0.9);
  }

  /* 4 ── comets */
  .comet {
    position: fixed; pointer-events: none;
    width: 22vw; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(147, 242, 189, 0.85), transparent);
    filter: drop-shadow(0 0 8px rgba(63, 214, 133, 0.8));
    opacity: 0;
    transform: rotate(-22deg);
    animation: comet-fly 11s ease-in infinite;
  }
  .c1 { top: 14%; left: -24%; animation-delay: 3s; }
  .c2 { top: 46%; left: -24%; width: 15vw; animation-delay: 8.2s; }
  .c3 { top: 72%; left: -24%; width: 12vw; animation-delay: 14.6s; animation-duration: 16s; }
  @keyframes comet-fly {
    0%, 86% { opacity: 0; transform: translateX(0) rotate(-22deg); }
    88.5% { opacity: 0.85; }
    100% { opacity: 0; transform: translateX(150vw) rotate(-22deg); }
  }

  /* 5 ── cinematic grade: grain + vignette + top sheen */
  .grade { pointer-events: none; }
  .grade::before {
    /* film grain */
    content: '';
    position: absolute; inset: -60px;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(210, 255, 232, 0.05) 1px, transparent 1px),
      radial-gradient(circle at 17px 11px, rgba(210, 255, 232, 0.025) 1px, transparent 1px);
    background-size: 26px 26px, 41px 41px;
    animation: grain-shift 0.9s steps(3) infinite;
    opacity: 0.55;
  }
  @keyframes grain-shift {
    0%   { transform: translate(0, 0); }
    33%  { transform: translate(-14px, 9px); }
    66%  { transform: translate(11px, -13px); }
    100% { transform: translate(0, 0); }
  }
  .grade::after {
    /* vignette + subtle top light */
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(147, 242, 189, 0.045) 0%, transparent 12%),
      radial-gradient(ellipse 88% 78% at 50% 46%, transparent 55%, rgba(2, 7, 4, 0.55) 100%);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <canvas id="gl" class="layer"></canvas>
  <canvas id="dust" class="layer"></canvas>
  <div class="rings layer">
    <div class="ring-b"></div>
    <div class="ring-a"></div>
    <div class="ring-c"></div>
    <div class="ring-d"></div>
  </div>
  <div class="comet c1"></div>
  <div class="comet c2"></div>
  <div class="comet c3"></div>
  <div class="grade layer"></div>

<script>
'use strict';

/* toggles — flip while iterating with the design team */
const FLAGS = { aurora: true, dust: true, rings: true, comets: true };
if (!FLAGS.rings)  document.querySelector('.rings').style.display = 'none';
if (!FLAGS.comets) document.querySelectorAll('.comet').forEach(c => c.style.display = 'none');

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════════════════════════════════════════════════════════
 *  1 · WEBGL AURORA — domain-warped fbm, emerald/gold grade
 * ══════════════════════════════════════════════════════════════════ */
(function aurora() {
  if (!FLAGS.aurora) return;
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { antialias: false, depth: false, stencil: false, alpha: false })
          || cv.getContext('experimental-webgl');
  if (!gl) return; /* CSS gradient fallback stays visible */

  const VSRC = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

  const FSRC = `
    precision highp float;
    uniform vec2  u_res;
    uniform float u_time;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i),                 hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }

    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 rot = mat2(1.6, 1.2, -1.2, 1.6);
      for (int i = 0; i < 5; i++) { v += a * noise(p); p = rot * p; a *= 0.5; }
      return v;
    }

    /* one aurora curtain: sharp luminous base edge, rayed body, long tail */
    vec3 curtain(vec2 uv, float t, float yBase, float tilt, float amp, float widthK, float gain, float raySeed) {
      float xx = uv.x * 2.2;
      float curve = yBase
        + tilt * (uv.x - 0.5)
        + amp * sin(xx * 1.5 + t * 1.1)
        + amp * 0.9 * fbm(vec2(xx * 0.8 + t * 0.35, raySeed));
      float d = uv.y - curve;
      float w = widthK * (1.0 + 0.55 * fbm(vec2(xx * 1.3 - t * 0.4, raySeed + 4.2)));

      /* sharp below the edge, long glowing tail above it */
      float env = d > 0.0
        ? exp(-d / (w * 3.0))
        : exp(-(d * d) / (w * w * 0.085));

      /* vertical rays — the aurora signature (irregular, high contrast) */
      float bend = fbm(vec2(uv.x * 4.2, t * 0.5 + raySeed)) * 3.2;
      float rays = fbm(vec2(uv.x * 22.0 + bend, t * 1.6 + raySeed));
      rays = 0.28 + 0.72 * pow(rays, 1.6);
      float rays2 = 0.60 + 0.40 * noise(vec2(uv.x * 55.0 - t * 2.0, raySeed * 3.1));
      float A = env * rays * rays2 * gain;

      vec3 core = vec3(0.50, 1.00, 0.68);
      vec3 mint = vec3(0.16, 0.82, 0.46);
      vec3 teal = vec3(0.024, 0.270, 0.170);
      vec3 gold = vec3(0.90, 0.66, 0.22);

      /* colour along the tail: hot mint core → mint → deep teal */
      vec3 aur = mix(core, mint, clamp(d / (w * 0.55), 0.0, 1.0));
      aur = mix(aur, teal, clamp(d / (w * 3.6), 0.0, 1.0));
      vec3 col = aur * A;

      /* the faintest warm whisper under the bright edge */
      float fringe = exp(-pow((d + w * 0.45) / (w * 0.20), 2.0));
      col += gold * fringe * rays * 0.09 * gain;
      return col;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_res.xy;
      vec2 p  = (gl_FragCoord.xy - 0.5 * u_res.xy) / u_res.y;
      float t = u_time * 0.055;

      vec3 deep = vec3(0.006, 0.020, 0.013);
      vec3 em   = vec3(0.022, 0.150, 0.085);

      /* near-black stage with a whisper of drifting silk */
      vec2 ps = vec2(p.x * 0.9, p.y * 1.8);
      float fog = fbm(ps * 1.2 + vec2(t * 0.5, -t * 0.2));
      vec3 col = deep + em * fog * 0.30;

      /* main curtain sweeping the upper stage + a deeper one behind it */
      col += curtain(uv, t,        0.62,  0.16, 0.14, 0.105, 1.55, 3.7);
      col += curtain(uv, t * 0.8,  0.85, -0.08, 0.07, 0.120, 0.36, 9.3);
      /* low counter-curtain grazing the bottom — keeps the stage floor alive */
      col += curtain(uv, -t * 0.7, 0.05, -0.10, 0.05, 0.075, 0.34, 6.1);

      /* soft rising glow so overlaid objects never sit in pure black */
      col += em * 1.15 * exp(-3.0 * length(p - vec2(0.0, -0.66)));

      /* vignette + slow breathe */
      float vig = smoothstep(1.38, 0.34, length(p * vec2(1.02, 1.28)));
      col *= mix(0.36, 1.0, vig);
      col *= 0.95 + 0.05 * sin(u_time * 0.22);

      /* filmic-ish tame of the highlights */
      col = col / (1.0 + col * 0.45);

      /* dither to kill banding */
      col += (hash(gl_FragCoord.xy) - 0.5) * 0.012;

      gl_FragColor = vec4(col, 1.0);
    }`;

  function mk(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  const vs = mk(gl.VERTEX_SHADER, VSRC), fs = mk(gl.FRAGMENT_SHADER, FSRC);
  if (!vs || !fs) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'u_res');
  const uTime = gl.getUniformLocation(prog, 'u_time');

  /* render at 0.7 scale, DPR-capped — soft is good for a backdrop, and cheap */
  const SCALE = 0.85 * Math.min(1.5, devicePixelRatio || 1);
  function size() {
    cv.width = Math.round(innerWidth * SCALE);
    cv.height = Math.round(innerHeight * SCALE);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  size(); addEventListener('resize', size);

  const t0 = performance.now();
  function draw() {
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uTime, (performance.now() - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!REDUCED) requestAnimationFrame(draw);
  }
  draw();
})();

/* ══════════════════════════════════════════════════════════════════
 *  2 · LIGHT DUST — drifting motes with depth + twinkle
 * ══════════════════════════════════════════════════════════════════ */
(function dust() {
  if (!FLAGS.dust) return;
  const cv = document.getElementById('dust'), cx = cv.getContext('2d');
  let W, H, motes;
  function size() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.round(Math.min(150, W * H / 15000));
    motes = Array.from({ length: n }, () => spawn(true));
  }
  function spawn(anywhere) {
    const depth = 0.25 + Math.random() * 0.75; /* far … near */
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 10,
      vx: (Math.random() - 0.5) * 0.06 * depth,
      vy: -(0.05 + Math.random() * 0.16) * depth,
      r: (0.5 + Math.random() * 1.8) * depth,
      tw: Math.random() * Math.PI * 2,
      tws: 0.4 + Math.random() * 1.4,
      depth: depth,
      gold: Math.random() < 0.07,
    };
  }
  size(); addEventListener('resize', size);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last) / 16.7; last = now;
    cx.clearRect(0, 0, W, H);
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.tw += 0.02 * m.tws * dt;
      if (m.y < -12 || m.x < -12 || m.x > W + 12) { motes[i] = spawn(false); continue; }
      const a = (0.12 + 0.30 * (0.5 + 0.5 * Math.sin(m.tw))) * m.depth;
      cx.fillStyle = m.gold
        ? `rgba(216, 180, 90, ${a.toFixed(3)})`
        : `rgba(147, 242, 189, ${a.toFixed(3)})`;
      cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 7); cx.fill();
    }
    if (!REDUCED) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

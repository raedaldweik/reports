<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلفية اللوحة — شرطة دبي</title>
<style>
  /* ════════════════════════════════════════════════════════════════════
   *  ✦  شرطة دبي · خلفية اللوحة الرئيسية  ✦
   *  Cinematic Dubai plate (AI-generated still, embedded) + live grade:
   *  harmonizing tint, vignette, grain, and a slow Ken-Burns drift.
   *  Add ?static to the URL to freeze the drift.
   * ════════════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030806; }

  .layer { position: fixed; inset: 0; }

  img.city {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 40%;
    display: block;
  }
  /* slow cinematic drift — imperceptible per-second, alive per-minute */
  @keyframes kb { from { transform: scale(1.0) translateY(0); } to { transform: scale(1.05) translateY(-0.6%); } }
  body.motion img.city { animation: kb 75s ease-in-out infinite alternate; will-change: transform; }
  @media (prefers-reduced-motion: reduce) { body.motion img.city { animation: none; } }

  /* harmonizing tint — pulls the plate toward brand green, deepens edges for content */
  .tint {
    background:
      radial-gradient(ellipse 70% 55% at 62% 34%, transparent 42%, rgba(3, 12, 8, 0.22) 100%),
      linear-gradient(180deg, rgba(3, 12, 8, 0.20) 0%, rgba(3, 12, 8, 0.03) 22%, rgba(3, 12, 8, 0.02) 55%, rgba(3, 12, 8, 0.30) 100%),
      linear-gradient(0deg, rgba(18, 80, 55, 0.06), rgba(18, 80, 55, 0.06));
  }

  /* cinematic frame: vignette + hairline top light + grain */
  .grade::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(240, 245, 242, 0.045) 0%, transparent 1.5px),
      radial-gradient(ellipse 96% 90% at 50% 46%, transparent 62%, rgba(1, 5, 3, 0.48) 100%);
  }
  .grade::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(240, 245, 242, 0.028) 1px, transparent 1px),
      radial-gradient(circle at 19px 13px, rgba(240, 245, 242, 0.015) 1px, transparent 1px);
    background-size: 30px 30px, 47px 47px;
  }
</style>
</head>
